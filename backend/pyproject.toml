[project]
name = "gnomers-backend"
version = "0.1.0"
description = "Back-end do Gnomers: listas de compras com carrinho otimizado no iFood"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pulp>=2.9,<3",
    "mcp>=1.9",
    "anthropic>=0.70",
    "apscheduler>=3.10,<4",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
